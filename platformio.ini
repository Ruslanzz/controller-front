; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Два окружения:
;   bluepill_f103c8 — обычная сборка, прошивка с 0x08000000 через ST-Link;
;   katapult        — сборка под CAN-загрузчик Katapult, приложение с
;                     0x08002000 (см. docs/KATAPULT.md).
; Собрать конкретное: pio run -e katapult

[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

[env:bluepill_f103c8]
debug_tool = stlink
upload_protocol = stlink
upload_port = /dev/stlinkv2_3
#upload_resetmethod = wifio
#upload_command = /usr/local/share/openocd $UPLOADERFLAGS

[env:katapult]
build_flags = -D USE_KATAPULT_BOOTLOADER
board_build.ldscript = ldscript/stm32f103c8_katapult.ld
; Прошивка идёт по CAN утилитой Katapult, а не загрузчиком PlatformIO.
; Раскомментируйте и подставьте свой интерфейс и UUID узла:
;upload_protocol = custom
;upload_command = python3 ~/katapult/scripts/flash_can.py -i can0 -u <UUID> -f $SOURCE
